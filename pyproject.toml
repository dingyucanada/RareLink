[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rarelink"
version = "0.1.0"
description = "Agentic federated research console for rare disease studies"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "alembic>=1.18.5,<2",
  "cryptography>=49.0.0,<50",
  "fastapi>=0.140.0,<1",
  "psycopg[binary]>=3.3.4,<4",
  "uvicorn[standard]>=0.51.0,<1",
  "sqlmodel>=0.0.39,<1",
  "pydantic-settings>=2.14.2,<3",
  "PyJWT[crypto]>=2.13.0,<3",
  "openai>=2.48.0,<3",
  "opentelemetry-api>=1.44.0,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.44.0,<2",
  "opentelemetry-sdk>=1.44.0,<2",
  "prometheus-client>=0.26.0,<1",
  "pyyaml>=6.0.3,<7",
]

[project.optional-dependencies]
dev = [
  "build>=1.5.0,<2",
  "httpx>=0.28.1,<1",
  "nibabel>=5.4.2,<6",
  "numpy>=2.4.6,<3",
  "pydicom>=3.0.2,<4",
  "pytest>=9.1.1,<10",
  "pytest-cov>=7.1.0,<8",
  "ruff>=0.16.0,<1",
]
spark = [
  "monai>=1.6.0,<2",
  "numpy>=2.4.6,<3",
  "nibabel>=5.4.2,<6",
  "nvflare>=2.8.1,<2.9",
  "opacus>=1.6.0,<2",
  "scipy>=1.17.1,<2",
]
security = [
  "adversarial-robustness-toolbox==1.20.1",
]
site-data = [
  "monai>=1.6.0,<2",
  "numpy>=2.4.6,<3",
  "nibabel>=5.4.2,<6",
  "pydicom>=3.0.2,<4",
  "pybids>=0.22.0,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["rarelink"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
