receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
  batch:
    send_batch_size: 512
    timeout: 5s

exporters:
  otlphttp/approved_backend:
    endpoint: ${env:RARELINK_APPROVED_OTLP_BACKEND}
    tls:
      ca_file: /run/secrets/observability_ca.pem

service:
  telemetry:
    logs:
      level: warn
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/approved_backend]
